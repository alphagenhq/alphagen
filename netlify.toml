  headers = {User-Agent = "AlphaGen Research desk@alphagenresearch.com"}

[[redirects]]
  from = "/api/sec/merger"
  to = "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=DEFM14A&company=&dateb=&owner=include&start=0&count=40&output=atom"
  status = 200
  force = true
  headers = {User-Agent = "AlphaGen Research desk@alphagenresearch.com"}

[[redirects]]
