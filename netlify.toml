[build]
  publish = "."

# Same-origin proxies so the site can read official data without browser blocks
[[redirects]]
  from = "/feed.xml"
  to = "https://rss.beehiiv.com/feeds/dFFy8T23eL.xml"
  status = 200
  force = true

[[redirects]]
  from = "/api/yields/:month"
  to = "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/pages/xml?data=daily_treasury_yield_curve&field_tdr_date_value_month=:month"
  status = 200
  force = true

[[redirects]]
  from = "/api/debt"
  to = "https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v2/accounting/od/debt_to_penny?sort=-record_date&page%5Bsize%5D=1"
  status = 200
  force = true

[[headers]]
  for = "/wire.json"
  [headers.values]
    Cache-Control = "no-cache, max-age=0"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, max-age=0"

# Clean page URLs
[[redirects]]
  from = "/wire"
  to = "/wire.html"
  status = 200
[[redirects]]
  from = "/equities"
  to = "/equities.html"
  status = 200
[[redirects]]
  from = "/rates"
  to = "/rates.html"
  status = 200
[[redirects]]
  from = "/macro"
  to = "/macro.html"
  status = 200
[[redirects]]
  from = "/research"
  to = "/research.html"
  status = 200
[[redirects]]
  from = "/article"
  to = "/article.html"
  status = 200

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "no-cache, max-age=0"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
