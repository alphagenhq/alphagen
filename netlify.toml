[build]
  publish = "."

# ---- Same-origin proxies to official data ----
[[redirects]]
  from = "/feed.xml"
  to = "https://rss.beehiiv.com/feeds/dFFy8T23eL.xml"
  status = 200
  force = true

[[redirects]]
  from = "/api/yields/:month"
  to = "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/pages/xml?data=daily_treasury_yield_curve&field_tdr_date_value_month=:month"
  status = 200
  force = true

[[redirects]]
  from = "/api/debt"
  to = "https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v2/accounting/od/debt_to_penny?sort=-record_date&page%5Bsize%5D=1"
  status = 200
  force = true

[[redirects]]
  from = "/api/auctions"
  to = "https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v1/accounting/od/auctions_query?sort=-auction_date&page%5Bsize%5D=150"
  status = 200
  force = true

[[redirects]]
  from = "/api/fred/:id/:start"
  to = "https://fred.stlouisfed.org/graph/fredgraph.csv?id=:id&cosd=:start"
  status = 200
  force = true

# ---- Clean URLs: /about -> /about.html, /notes/x -> /notes/x.html (files always win) ----
[[redirects]]
  from = "/*"
  to = "/:splat.html"
  status = 200

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "no-cache, max-age=0"
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, max-age=0"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=600"
