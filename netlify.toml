  headers = {User-Agent = "AlphaGen Research desk@alphagenresearch.com"}

# ---- Clean URLs: /about -> /about.html, /notes/x -> /notes/x.html (files always win) ----
[[redirects]]
  from = "/*"
  to = "/:splat.html"
  status = 200

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "no-cache, max-age=0"
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, max-age=0"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=600"
