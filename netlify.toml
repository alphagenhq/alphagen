[build]
  publish = "."

# ---- Same-origin proxies to official data ----
[[redirects]]
  from = "/feed.xml"
  to = "https://rss.beehiiv.com/feeds/dFFy8T23eL.xml"
  status = 200
  force = true

[[redirects]]
  from = "/api/yields/:month"
  to = "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/pages/xml?data=daily_treasury_yield_curve&field_tdr_date_value_month=:month"
  status = 200
  force = true

[[redirects]]
  from = "/api/debt"
  to = "https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v2/accounting/od/debt_to_penny?sort=-record_date&page%5Bsize%5D=1"
  status = 200
  force = true

[[redirects]]
  from = "/api/auctions"
  to = "https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v1/accounting/od/auctions_query?sort=-auction_date&page%5Bsize%5D=150"
  status = 200
  force = true

[[redirects]]
  from = "/api/fred/:id/:start"
  to = "https://fred.stlouisfed.org/graph/fredgraph.csv?id=:id&cosd=:start"
  status = 200
  force = true


# ---- SEC EDGAR live filing feeds (SEC asks for a descriptive User-Agent) ----
[[redirects]]
  from = "/api/sec/formd"
  to = "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=D&company=&dateb=&owner=include&start=0&count=40&output=atom"
  status = 200
  force = true
  headers = {User-Agent = "AlphaGen Research desk@alphagenresearch.com"}

[[redirects]]
  from = "/api/sec/s1"
  to = "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=S-1&company=&dateb=&owner=include&start=0&count=40&output=atom"
  status = 200
  force = true
  headers = {User-Agent = "AlphaGen Research desk@alphagenresearch.com"}

[[redirects]]
