name: Deal scan
on:
  workflow_dispatch:
    inputs:
      end: { description: "End date (YYYY-MM-DD)", required: false, default: "" }
      mcap_tickers: { description: "Only fetch current market caps for these tickers", required: false, default: "" }
permissions: { contents: write }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: site, sparse-checkout: .github }
      - run: |
          mkdir out
          if [ -n "${{ github.event.inputs.mcap_tickers }}" ]; then python3 site/.github/scripts/mcap_now.py out "${{ github.event.inputs.mcap_tickers }}"; cp out/mcap_now.json out/deals.json.skip 2>/dev/null; else python3 site/.github/scripts/deal_scan.py out ${{ github.event.inputs.end }}; fi
      - name: Publish to research branch
        run: |
          cd out
          git init -q -b research-$( [ -f mcap_now.json ] && echo mcap || echo deals )
          git config user.name "AlphaGen"; git config user.email "alphagenhq@users.noreply.github.com"
          git add -A && git commit -qm "Deal scan $(date -u +%F' '%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:$(git branch --show-current)
