name: Deal scan
on:
  workflow_dispatch:
    inputs:
      end: { description: "End date (YYYY-MM-DD)", required: false, default: "" }
permissions: { contents: write }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: site, sparse-checkout: .github }
      - run: mkdir out && python3 site/.github/scripts/deal_scan.py out ${{ github.event.inputs.end }}
      - name: Publish to research branch
        run: |
          cd out
          git init -q -b research
          git config user.name "AlphaGen"; git config user.email "alphagenhq@users.noreply.github.com"
          git add deals.json && git commit -qm "Deal scan $(date -u +%F' '%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:research
